name: Clean Linux first-install smoke test

on:
  pull_request:
    branches: ["main"]
    paths:
      - "installer/**"
      - "tests/test_first_install.py"
      - ".github/workflows/first-install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PIP_NO_CACHE_DIR: "1"
      HOME: ${{ runner.temp }}/hg-fresh-home
      XDG_DATA_HOME: ${{ runner.temp }}/hg-fresh-home/.local/share
      XDG_STATE_HOME: ${{ runner.temp }}/hg-fresh-home/.local/state

    steps:
      - name: Check out installer
        uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Set up a clean Python (no preinstalled GUI packages)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install official signed GUI from scratch
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          printf 'INSTALL\n' | python installer/install_gui.py

      - name: Verify private Python runtime, menu shortcut, and CLI isolation
        run: |
          set -euo pipefail
          "$XDG_DATA_HOME/hackersghost-ai-gui/runtime/bin/python" -I -c "import PySide6, cryptography; print('Fresh GUI runtime dependencies: OK')"
          python - <<'PY'
          import configparser
          import os
          from pathlib import Path

          base = Path(os.environ["XDG_DATA_HOME"])
          root = base / "hackersghost-ai-gui"
          menu = base / "applications/hackersghost-ai-gui.desktop"
          assert menu.is_file(), "No menu shortcut was created"
          config = configparser.ConfigParser(interpolation=None)
          config.read(menu)
          entry = config["Desktop Entry"]
          assert entry["X-HackersGhost-GUI-Launcher"] == "1"
          assert entry["X-HackersGhost-GUI-Version"] == "2.1.0"
          assert str(root / "releases/HackersGhost-AI-2.1.0") in entry["Exec"]
          assert not (Path.home() / ".local/bin/hackersghost-ai").exists()
          assert (root / "releases/HackersGhost-AI-2.1.0/hackersghost_ai/gui/app.py").is_file()
          print("Clean first-install, menu launcher, and CLI isolation: OK")
          PY
